<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>イカゲット – ランキング</title>
  <link rel="stylesheet" href="./src/ranking/page.css?v=3">
</head>
<body>
  <main class="rank-page">
    <header class="rank-header">
      <div>
        <a class="back" id="go-home" href="./">ゲームに戻る</a>
        <h1>イカゲット <span id="board-title">ランキング</span></h1>
      </div>
      <select id="language" aria-label="言語"></select>
    </header>
    <dl class="stats">
      <div><dt id="fishing-label">釣りのプレイ回数</dt><dd id="fishing-count">—</dd></div>
      <div><dt id="registered-label">漁師登録</dt><dd id="registered-count">—</dd></div>
    </dl>
    <div id="mode-tabs" role="tablist" aria-label="ランキング">
      <button type="button" id="fishing-tab" role="tab" data-mode="fishing" aria-controls="ranking-panel" aria-selected="true">釣り</button>
      <button type="button" id="butcher-tab" role="tab" data-mode="butcher" aria-controls="ranking-panel" aria-selected="false" tabindex="-1">解体</button>
      <button type="button" id="cooking-tab" role="tab" data-mode="cooking" aria-controls="ranking-panel" aria-selected="false" tabindex="-1">料理</button>
    </div>
    <section id="ranking-panel" role="tabpanel" aria-labelledby="fishing-tab" tabindex="0">
      <div class="status" id="board-status" role="status"></div>
      <button class="retry" id="retry" type="button" hidden>再読み込み</button>
      <nav class="board-pagination" data-pagination aria-label="ページ切り替え" hidden>
        <button type="button" data-page-step="-1">前へ</button>
        <span data-page-label aria-live="polite"></span>
        <button type="button" data-page-step="1">次へ</button>
      </nav>
      <table id="board-table" hidden>
        <thead><tr><th id="rank-label" scope="col">順位</th><th id="name-label" scope="col">名前</th><th id="score-label" scope="col">スコア</th></tr></thead>
        <tbody id="board-rows"></tbody>
      </table>
      <nav class="board-pagination" data-pagination aria-label="ページ切り替え" hidden>
        <button type="button" data-page-step="-1">前へ</button>
        <span data-page-label></span>
        <button type="button" data-page-step="1">次へ</button>
      </nav>
    </section>
    <a class="detail-link" id="ranking-details" href="https://chameleonjp-lab.github.io/chameleonjp_lab/ranking.html?game=ikagetto&amp;lang=ja&amp;mode=fishing">ランキング詳細</a>
  </main>
  <script type="module" src="./src/ranking/page.js?v=3"></script>
</body>
</html>
